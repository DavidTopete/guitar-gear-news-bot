name: Guitar Gear News Bot

on:
  schedule:
    # 10:00 AM hora San Luis Río Colorado / Sonora
    # Sonora ≈ UTC-7
    # 10 AM Sonora = 17:00 UTC
    - cron: '0 17 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py

      - name: Save bot state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add noticias_enviadas.json
          git add fuente_estado.json

          git commit -m "Update bot state" || echo "No changes"

          git push
