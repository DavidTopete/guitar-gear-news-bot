name: Guitar Gear News Bot

on:
  schedule:
    # 10:17 AM San Luis Río Colorado / Sonora
    # Sonora = UTC-7
    # 10:17 AM = 17:17 UTC
    # Se usa :17 para reducir retrasos de GitHub Actions
    # que suelen ocurrir al inicio de cada hora.
    - cron: '17 17 * * *'

  # Permite ejecutar manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guitar-gear-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ======================================================
      # 3. MOSTRAR HORA DE EJECUCIÓN
      # ======================================================
      - name: Show execution time
        run: |
          echo "========================================"
          echo "Guitar Gear News Bot"
          echo "========================================"
          echo "UTC time:"
          date -u
          echo ""
          echo "Runner time:"
          date
          echo "========================================"


      # ======================================================
      # 4. INSTALAR DEPENDENCIAS
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. EJECUTAR BOT
      # ======================================================
      - name: Run Guitar Gear News Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py


      # ======================================================
      # 6. GUARDAR ESTADO DEL BOT
      # ======================================================
      - name: Save bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking bot state files..."

          git add noticias_enviadas.json
          git add fuente_estado.json

          if git diff --cached --quiet; then
            echo "No changes in bot state."
            exit 0
          fi

          echo "Changes detected."

          git commit -m "Update bot state"

          echo "Updating local repository..."
          git pull --rebase origin main

          echo "Pushing updated bot state..."
          git push origin HEAD:main

          echo "Guitar Gear News Bot state successfully updated."
